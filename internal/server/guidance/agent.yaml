version: "3.0"
priority: high
summary: 使用 MCPX 原生编程工具执行命令与补丁；核心逻辑参照 Codex 源码移植，无需 Codex 可执行文件。
rules:
  - 编程核心只有 exec_command、write_stdin、apply_patch；由 MCPX 内部 unifiedexec/patch 包执行，不启动 Codex CLI 或 exec-server，不调用模型/API。其余工具属于 MCPX 网关管理面，用于会话、计划、观测、产物和扩展。
  - 不要猜测路径、符号、工具能力或执行结果。源码读取、列表和搜索直接用 exec_command 运行 rg、cat、sed 等命令；参数已知即可调用，无需先 describe、维护文件 revision token 或选择 read 视图。
  - exec_command 的 cmd 是原始 shell 命令；workdir 默认当前 Remote Session 的 Workspace 根目录，物理路径必须在该 Workspace 内。需要交互终端时设 tty=true；shell 是可执行路径，login 控制登录 shell 语义。
  - exec_command/write_stdin 的 structuredContent 直接提供 output、exit_code 或仍在运行的整数 session_id；stdout/stderr 合并在 output。非零退出是命令执行结果，应结合输出判断，不能当成 MCP 协议错误或自动重试信号。
  - 长命令用返回的整数 session_id 调用 write_stdin；chars 为空或省略表示等待新输出，有内容表示写入 stdin。session_id 是进程句柄，不是 remote_session_id、execution_task_id 或 operation_id；不要自行转换或重建。
  - apply_patch 只接收包含 Codex 格式原始补丁的 input 字符串；MCP 的 JSON 对象只是传输包装。补丁从 *** Begin Patch 到 *** End Patch，支持 Add/Update/Delete/Move；路径相对 session root，不接受 workdir 或旧 edits/rev 参数。
  - 修改前读取足够的当前证据并保留已有用户改动；补丁结果读取 MCPX 本地 backend 的输出；查看源码差异时用 exec_command 运行 git diff。补丁失败时检查原始输出，重新读取相关文件后修正补丁，不盲目重放。验证遵循最小充分证据，区分已验证事实、未验证事项和服务端限制。
  - MCPX 强制应用当前权限配置；编程工具不提供 sandbox_permissions，也不接收 purpose/user_confirmed。Runtime 从原始 cmd/input 推导操作用途，Confirm 由现有 console 审批；这与 Codex 自身的 sandbox/approval 参数体系不同。
  - 源码移植只覆盖选定的进程与补丁逻辑，不代表完整 Codex sandbox、模型 agent 或全面逐行等价；Workspace 路径检查不等于 OS 沙箱。不得把可选外部 baseline 差分当成默认运行依赖。
  - 编程工具直接调用，不套用 ARC、自动 replay 或 Operation；再次 exec_command 是一次新的执行。需要并行的命令由客户端并发调用，分别保留进程句柄。operation_batch/operation_manage 仅用于网关管理面工作。
  - remote_session_id 是 Workspace 和角色的路由上下文；当前 MCP transport 已绑定时可省略。丢失或失效时用 session(action=list) 找到目标，再用服务端返回的完整 ID 恢复；不要通过新建会话假装恢复原会话。进程句柄不承诺跨 Runtime 重启恢复。
  - 管理面按各自 schema 调用；observe 查看网关会话、历史和持久任务，process 输出仍用 write_stdin。move_out 提供独立的 prepare → 用户确认 → submit 安全移出流程，不承担补丁编辑。扩展仅在任务需要时通过 skill_tool/mcp_tool 的 list、describe、call 使用。
  - 管理面支持的 activity 仅填写新的公开工作摘要，不重复 heartbeat，不记录隐藏推理。progress 用于有意义的里程碑、等待、阻塞或失败；正常任务最终回复前用 completed 和 result 汇报已验证结果。编程工具不要求这些附加参数。
tool_routing:
  inspect_source: [exec_command]
  run_commands: [exec_command]
  continue_process: [write_stdin]
  modify_files: [apply_patch]
  inspect_changes: [exec_command]
  select_workspace: [workspace]
  session_lifecycle: [session]
  inspect_environment: [environment_read]
  snapshot_environment: [environment]
  safe_move_out: [move_out]
  observe_gateway: [observe]
  report_milestone: [progress]
  plan_work: [plan]
  manage_artifacts: [artifact]
  manage_operations: [operation_batch, operation_manage]
  inspect_gateway: [runtime_read]
  skill_extension: [skill_tool]
  mcp_extension: [mcp_tool]
  browser_control: [browser]
  capture_screen: [screenshot_capture]
  provide_secret: [secret_provide]
